[project]
name = "seqrec"
version = "0.1.0"
description = "Sequential recommendation benchmark: GRU4Rec, SASRec, BERT4Rec, and SR-GNN"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "chai-mi", email = "107172917+chai-mi@users.noreply.github.com" }]
dependencies = [
  "altair>=6.3.0",
  "datasets>=5.1.0",
  "orjson>=3.13.0",
  "polars>=2.1.0",
  "rich>=15.0.0",
  "torch>=2.14.1",
  "torchmetrics>=1.9.0",
  "tqdm>=4.70.1",
  "tyro>=1.0.16",
  "vl-convert-python>=1.9.0.post1",
]

[project.scripts]
seqrec = "seqrec.cli:main"

[dependency-groups]
dev = [
  "marimo>=0.25.2",
  "ruff>=0.17.3",
  "ty>=0.0.95",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
